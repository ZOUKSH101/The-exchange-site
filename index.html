<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>The Exchange @ EUI</title>
    <meta
      name="description"
      content="The Exchange is a student finance and investing club at the Egypt University of Informatics. We teach you to keep your money."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Exchange @ EUI" />
    <meta
      property="og:description"
      content="A student finance and investing club at the Egypt University of Informatics. We teach you to keep your money."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts load from the document, not from a CSS @import, so the request
         starts with the HTML instead of after the stylesheet is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@300;400&display=swap"
    />
    <!-- §10 — capability classes, both polarities, set BEFORE first paint so the
         first frame is already correct. No FOUC, no flash of unstyled motion. -->
    <script>
      (function () {
        var h = document.documentElement,
          add = [],
          set = function (name, on) {
            add.push(on ? name : 'no-' + name)
          }
        h.classList.remove('no-js')
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
        set('js', true)
        set('reduced-motion', reduced)
        set('touch', 'ontouchstart' in window || navigator.maxTouchPoints > 0)
        set('safari', /^((?!chrome|android).)*safari/i.test(navigator.userAgent))
        set('small-breakpoint', matchMedia('(max-width: 734px)').matches)
        /* Viewport SHAPES the enhanced experience was not designed for — mostly
           short ones, where a scroll-pinned composition has no room to breathe. */
        var invalid = [
          '(max-width: 734px) and (max-height: 500px)',
          '(min-width: 735px) and (max-width: 1068px) and (max-height: 520px)',
          '(min-width: 1069px) and (max-height: 620px)',
        ].some(function (q) {
          return matchMedia(q).matches
        })
        set('enhanced', !invalid && !reduced)
        h.classList.add.apply(h.classList, add)
        h.style.setProperty('--global-scrollbar-width', window.innerWidth - h.clientWidth + 'px')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
